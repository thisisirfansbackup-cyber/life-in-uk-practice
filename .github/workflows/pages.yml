name: Deploy Life in the UK Practice

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify tests and complete content
        run: |
          npm run build:bank
          git diff --exit-code -- data/questions.json
          npm test
          npm run check:bank:full
      - name: Assemble public site files
        run: |
          mkdir -p _site/src _site/data
          cp index.html _site/index.html
          cp src/*.js src/*.css _site/src/
          cp data/questions.json _site/data/questions.json
          cp data/legacy-question-map.json _site/data/legacy-question-map.json
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify the assembled public site in a browser
        run: npm run test:browser
        env:
          E2E_SITE_DIR: _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
